{{- if .Values.defaultComponents.enabled }}
{{- if .Values.defaultComponents.umbrella.enabled }}
{{- /* Only the readonly umbrella mode is supported until full (woop/autoscaler)
       support is validated. Compute the effective tags and fail the install
       early when a non-readonly mode is requested. */ -}}
{{- $umbrellaTags := .Values.defaultComponents.umbrella.tags }}
{{- if not $umbrellaTags }}
{{-   if .Values.extendedPermissions }}
{{-     $umbrellaTags = dict "full" true }}
{{-   else }}
{{-     $umbrellaTags = dict "readonly" true }}
{{-   end }}
{{- end }}
{{- range $tag, $enabled := $umbrellaTags }}
{{-   if and $enabled (ne $tag "readonly") }}
{{-     fail "castai-umbrella supports only the readonly tag for now; non-readonly modes (node-autoscaler, workload-autoscaler, full, autoscaler-anywhere, autoscaler-openshift) are not supported yet. Remove --extended-permissions / --tag or set --tag=readonly." }}
{{-   end }}
{{- end }}
---
apiVersion: castware.cast.ai/v1alpha1
kind: Component
metadata:
  name: {{ .Values.defaultComponents.umbrella.component | default "castai-umbrella" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: hook-failed
    helm.sh/hook-weight: "10"
  labels:
    {{- include "castware-operator.labels" . | nindent 4 }}
spec:
  component: {{ .Values.defaultComponents.umbrella.component | default "castai-umbrella" | quote }}
  cluster: {{ .Values.defaultComponents.umbrella.cluster | default "castai" | quote }}
  enabled: true
  values:
    tags:
      {{- toYaml $umbrellaTags | nindent 6 }}
    {{- if .Values.defaultComponents.umbrella.overrides }}
    {{- toYaml .Values.defaultComponents.umbrella.overrides | nindent 4 }}
    {{- end }}
{{- else }}
{{- range $name, $comp := .Values.defaultComponents.components }}
---
apiVersion: castware.cast.ai/v1alpha1
kind: Component
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: hook-failed
    helm.sh/hook-weight: "10"
  labels:
    {{- include "castware-operator.labels" $ | nindent 4 }}
spec:
  component: {{ $comp.component | quote }}
  cluster: {{ $comp.cluster | quote }}
  enabled: {{ $comp.enabled }}
  {{- if $comp.version }}
  version: {{ $comp.version | quote }}
  {{- end }}
  {{- if $comp.overrides }}
  values:
    {{- toYaml $comp.overrides | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
