# Example values file for castware-operator
# This demonstrates how to configure the operator with default CRs and resources

image:
  repository: cast.ai/castware-operator
  tag: "0.0.2"
  pullPolicy: IfNotPresent

# Enable CRD installation
installCRDs: true

# Enable webhooks with cert-manager
webhook:
  enabled: true
  certManager:
    enabled: false

# Leader election configuration
leaderElection:
  enabled: true
  resourceLock: "leases"
  resourceName: "castware-operator-leader-election"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi


# API Key Secret configuration
# Set this to true to create the secret, and provide the API key via --set
apiKeySecret:
  create: true
  name: "castware-api-key"

# Create a default cluster
defaultCluster:
  enabled: true
  name: "castai"
  provider: "gke"
  api:
    apiUrl: "https://api.cast.ai"
    # Optional: apiGrpcUrl, grpcUrl, kvisorGrpcUrl
  # Will use apiKeySecret.name if not specified
  apiKeySecret: ""

# Create default components via umbrella (recommended)
defaultComponents:
  enabled: true
  umbrella:
    enabled: true
    component: "castai-umbrella"
    cluster: "castai"
    # tags are auto-derived from extendedPermissions:
    #   extendedPermissions=true  → tags.full=true
    #   extendedPermissions=false → tags.readonly=true
    # Override by setting tags explicitly:
    # tags:
    #   readonly: true

# Alternative: individual component path (when umbrella.enabled is false)
# defaultComponents:
#   enabled: true
#   umbrella:
#     enabled: false
#   components:
#     castai-agent:
#       component: "castai-agent"
#       cluster: "castai"
#       enabled: true
#     spot-handler:
#       component: "spot-handler"
#       cluster: "castai"
#       enabled: true

# -- Used to set additional volumes.
extraVolumes: []

# -- Used to set additional volume mounts.
extraVolumeMounts: []
