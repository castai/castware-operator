---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role-ext
  labels:
    castware.cast.ai/extended-permissions: "true"
rules:
  # Readonly.
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "nodes"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - ""
    resources:
      - "namespaces"
    verbs:
      - "get"
  - apiGroups:
      - ""
    resources:
      - "events"
    verbs:
      - "list"
    # For CAST autoscaling CRDs management.
  - apiGroups:
      - "autoscaling.cast.ai"
    resources:
      - "*"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "patch"
      - "create"
      - "delete"
      - "update"
  # For advertising extended resources
  - apiGroups:
      - ""
    resources:
      - "nodes/status"
    verbs:
      - "patch"
      - "update"
  # For node draining and patching. Node creation is required by the
  # pod-pinner and pod-pinner-ext (tags.full), which create Node objects
  # to pin pods to.
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "create"
      - "patch"
      - "update"
  # For pod lifecycle management (live-controller, pod-mutator, pod-pinner,
  # workload-autoscaler).
  - apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "create"
      - "delete"
      - "patch"
      - "update"
  - apiGroups:
      - ""
    resources:
      - "pods/eviction"
    verbs:
      - "create"
  # For node deletion.
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "delete"
  # For csr approval.
  - apiGroups:
      - "certificates.k8s.io"
    resources:
      - "certificatesigningrequests"
    verbs:
      - "get"
      - "list"
      - "delete"
      - "create"
      - "watch"
  - apiGroups:
      - "certificates.k8s.io"
    resources:
      - "certificatesigningrequests/approval"
    verbs:
      - "patch"
      - "update"
  - apiGroups:
      - "certificates.k8s.io"
    resources:
      - "signers"
    resourceNames:
      - "kubernetes.io/kubelet-serving"
      - "kubernetes.io/kube-apiserver-client-kubelet"
    verbs:
      - "approve"
  # For creating, updating and deleting events.
  - apiGroups:
      - ""
    resources:
      - "events"
    verbs:
      - "create"
      - "delete"
      - "patch"
      - "update"
  # For live migration
  - apiGroups:
      - "live.cast.ai"
    resources:
      - "*"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "patch"
      - "create"
      - "delete"
      - "update"
  # For installing/updating CAST AI components.
  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - "roles"
    resourceNames:
      - castai-cluster-controller
      - castai-evictor
      - castai-agent
      - castai-spot-handler
      - castai-kvisor
      - castai-kvisor-controller
      - castai-egressd
      - castai-pod-pinner
      - castai-ai-optimizer-proxy
    verbs:
      - "get"
      - "patch"
      - "update"
      - "delete"
  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - clusterroles
      - clusterrolebindings
    resourceNames:
      # `-ext` ClusterRoles should not be added here, because we do not want to touch them after installation.
      - castai-cluster-controller
      - castai-evictor
      - castai-agent
      - castai-spot-handler
      - castai-kvisor
      - castai-kvisor-controller
      - castai-egressd
      - castai-pod-pinner
      - castai-ai-optimizer-proxy
      - castai-cluster-controller-ext
    verbs:
      - "get"
      - "delete"
  - apiGroups:
      - ""
    resources:
      - "namespaces"
    resourceNames:
      - "castai-agent"
    verbs:
      - "delete"
  - apiGroups:
      - ""
    resources:
      - "namespaces"
    resourceNames:
      - "castai-llms"
    verbs:
      - "get"
      - "delete"
  - apiGroups:
      - "admissionregistration.k8s.io"
    resourceNames:
      - "castai-pod-pinner"
    resources:
      - "mutatingwebhookconfigurations"
    verbs:
      - "get"
      - "patch"
  # For creating pod mutations-related custom resources
  - apiGroups:
      - "pod-mutations.cast.ai"
    resources:
      - "*"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "patch"
      - "create"
      - "delete"
      - "update"
  # For volume attach/detach during live migration (live-controller,
  # tags.full): it creates VolumeAttachments on the target node before
  # cutover and deletes them from the source node afterwards.
  - apiGroups:
      - "storage.k8s.io"
    resources:
      - "volumeattachments"
    verbs:
      - "create"
      - "get"
      - "list"
      - "delete"
      - "watch"
  # tags.full component permissions (workload-autoscaler, live-controller,
  # pod-mutator, pod-pinner, evictor) not covered by the base manager-role.
  - apiGroups:
      - ""
    resources:
      - "nodes/metrics"
    verbs:
      - "get"
  - apiGroups:
      - ""
    resources:
      - "pods/binding"
    verbs:
      - "create"
  - apiGroups:
      - ""
    resources:
      - "pods/resize"
    verbs:
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "persistentvolumeclaims"
      - "persistentvolumes"
    verbs:
      - "patch"
  # For workload modifications (workload-autoscaler, live-controller).
  - apiGroups:
      - "apps"
    resources:
      - "deployments"
      - "replicasets"
      - "statefulsets"
    verbs:
      - "patch"
      - "update"
  - apiGroups:
      - "batch"
    resources:
      - "jobs"
    verbs:
      - "patch"
  - apiGroups:
      - "batch"
    resources:
      - "cronjobs"
    verbs:
      - "patch"
      - "update"
  - apiGroups:
      - "argoproj.io"
    resources:
      - "rollouts"
    verbs:
      - "patch"
      - "update"
  - apiGroups:
      - "autoscaling"
    resources:
      - "horizontalpodautoscalers"
    verbs:
      - "create"
      - "delete"
      - "patch"
      - "update"
  # For endpoint and storage discovery (live-controller).
  - apiGroups:
      - "discovery.k8s.io"
    resources:
      - "endpointslices"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - "storage.k8s.io"
    resources:
      - "csidrivers"
    verbs:
      - "get"
      - "list"
      - "watch"
  # For karpenter nodeclaims deletion (evictor).
  - apiGroups:
      - "karpenter.sh"
    resources:
      - "nodeclaims"
    verbs:
      - "delete"
  # For waiting on CRDs to be established (workload-autoscaler).
  - apiGroups:
      - "apiextensions.k8s.io"
    resources:
      - "customresourcedefinitions"
    verbs:
      - "watch"
